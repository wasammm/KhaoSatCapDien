<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Khảo Sát Cấp Điện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122A4A;
  --navy-2:#0B1B30;
  --navy-3:#1B3A61;
  --amber:#F5A623;
  --amber-dark:#C97F0B;
  --teal:#12A594;
  --red:#D6483F;
  --bg:#F0F2F0;
  --card:#FFFFFF;
  --ink:#15202B;
  --muted:#5B6B7A;
  --line:#DBE1E2;
  --line-strong:#B9C3C6;
  --radius:14px;
  --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
body{padding-bottom:76px;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--amber);color:var(--navy-2);}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;padding:14px 16px 12px;
  box-shadow:0 2px 10px rgba(11,27,48,.25);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:19px;height:19px;}
.brand-text{line-height:1.15;min-width:0;overflow:hidden;}
.brand-text .t1{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap;}
.brand-text .t2{font-size:10.5px;color:#9FB2C8;letter-spacing:.6px;text-transform:uppercase;}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 10px 6px 6px;border-radius:999px;}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--amber);color:var(--navy-2);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);}
.user-chip .u-name{font-size:12px;font-weight:600;}
.user-chip .u-role{font-size:9.5px;color:#A9BBCF;text-transform:uppercase;letter-spacing:.4px;}
.logout-btn{display:flex;align-items:center;gap:5px;background:rgba(214,72,63,.16);border:1px solid rgba(214,72,63,.4);color:#FFD9D6;padding:8px 11px;border-radius:10px;font-size:11.5px;font-weight:700;flex-shrink:0;}
.logout-btn svg{width:15px;height:15px;}
.logout-btn:active{background:rgba(214,72,63,.3);}
.sync-row{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:#B9C8D6;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(18,165,148,.25);}
.sync-dot.busy{background:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.25);animation:pulse 1s infinite;}
.sync-dot.warn{background:var(--red);box-shadow:0 0 0 3px rgba(214,72,63,.25);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ---------- Layout ---------- */
.screen{max-width:640px;margin:0 auto;padding:16px 14px 30px;}
.section-title{font-family:var(--font-display);font-weight:700;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--navy);display:flex;align-items:center;gap:8px;margin:22px 0 10px;}
.section-title .num{width:20px;height:20px;border-radius:6px;background:var(--navy);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);flex-shrink:0;}
.section-title:first-child{margin-top:4px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.1px;}
.field .req{color:var(--red);}
.input,.select,.textarea{
  width:100%;border:1.5px solid var(--line-strong);border-radius:9px;padding:11px 12px;
  font-size:14.5px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--navy-3);}
.textarea{resize:vertical;min-height:64px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.hint{font-size:11px;color:var(--muted);margin-top:4px;}

.choice-row{display:flex;gap:8px;flex-wrap:wrap;}
.choice{
  border:1.5px solid var(--line-strong);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;
  background:#fff;color:var(--muted);flex:1;text-align:center;min-width:110px;transition:.15s;
}
.choice.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.choice.active.amber{border-color:var(--amber-dark);background:var(--amber);color:var(--navy-2);}

.btn{border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:active{background:var(--navy-2);}
.btn-amber{background:var(--amber);color:var(--navy-2);}
.btn-teal{background:var(--teal);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line-strong);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.45;pointer-events:none;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.3px;text-transform:uppercase;}
.badge-draft{background:#E7E9EA;color:#54606B;}
.badge-pending{background:#FDEBCC;color:#8A5A08;}
.badge-approved{background:#D3F1EC;color:#0B7268;}
.badge-rejected{background:#FADADA;color:#A32E27;}

.plan-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
.plan-card.st-pending{border-left-color:var(--amber);}
.plan-card.st-approved{border-left-color:var(--teal);}
.plan-card.st-rejected{border-left-color:var(--red);}
.plan-card .pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.plan-card .pc-name{font-family:var(--font-display);font-weight:700;font-size:15px;}
.plan-card .pc-addr{font-size:12.5px;color:var(--muted);margin-top:3px;}
.plan-card .pc-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--muted);}

.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:10px;}
.empty .e-title{font-weight:700;color:var(--navy);margin-bottom:4px;font-family:var(--font-display);}

/* diagram */
.diagram-wrap{background:#F8F9F7;border:1px dashed var(--line-strong);border-radius:12px;padding:14px 10px 10px;}
.diagram-wrap svg{width:100%;height:auto;display:block;}

/* sketch drawing tool */
.sketch-toolbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch;}
.stool{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid var(--line-strong);background:#fff;color:var(--muted);border-radius:11px;padding:8px 11px;min-width:58px;}
.stool svg{width:18px;height:18px;}
.stool span{font-size:9.5px;font-weight:700;}
.stool.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.sketch-wrap{border:1.5px solid var(--line-strong);border-radius:12px;overflow:hidden;background:#FAFBF9;touch-action:none;}
#sketch-canvas{display:block;width:100%;height:300px;touch-action:none;}

/* materials table */
.mat-row{display:grid;grid-template-columns:2.4fr 0.8fr 0.8fr auto;gap:6px;align-items:center;margin-bottom:7px;}
.mat-row input{padding:8px 9px;font-size:13px;}
.mat-del{background:none;border:none;color:var(--red);font-size:17px;padding:4px 6px;}
.chip{display:inline-block;background:#EDF1F0;border:1px solid var(--line);color:var(--navy);font-size:11.5px;padding:5px 10px;border-radius:999px;margin:0 6px 6px 0;font-weight:600;}
.chip:active{background:var(--amber);}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;box-shadow:0 -2px 10px rgba(0,0,0,.05);}
.tab{flex:1;padding:9px 4px 10px;text-align:center;border:none;background:none;color:var(--muted);}
.tab svg{width:21px;height:21px;display:block;margin:0 auto 3px;}
.tab.active{color:var(--navy);}
.tab .tlabel{font-size:10.5px;font-weight:700;}
.fab{position:fixed;right:16px;bottom:82px;z-index:41;width:54px;height:54px;border-radius:50%;background:var(--amber);color:var(--navy-2);border:none;box-shadow:0 6px 16px rgba(245,166,35,.45);display:flex;align-items:center;justify-content:center;}
.fab svg{width:24px;height:24px;}

/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy-2);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;}

/* modal (replaces native confirm/prompt) */
.modal-overlay{position:fixed;inset:0;background:rgba(11,27,48,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;border-radius:16px;padding:22px 20px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal-msg{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.45;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}

/* filter chips */
.filter-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;}
.filter-chip{flex-shrink:0;border:1.5px solid var(--line-strong);background:#fff;color:var(--muted);font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;}
.filter-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
.stat-card .s-num{font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--navy);}
.stat-card .s-label{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;}
.staff-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.staff-bar-row .sb-name{font-size:12.5px;font-weight:600;width:96px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.staff-bar-track{flex:1;height:9px;background:#E9EBE9;border-radius:6px;overflow:hidden;}
.staff-bar-fill{height:100%;background:var(--navy-3);border-radius:6px;}
.staff-bar-row .sb-count{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--muted);width:20px;text-align:right;}

.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy-2),var(--navy) 60%,var(--navy-3));}
.onboard-card{background:#fff;border-radius:20px;padding:30px 26px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);}
.onboard-mark{width:52px;height:52px;border-radius:14px;background:var(--amber);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.onboard-mark svg{width:28px;height:28px;}
.onboard-card h1{font-family:var(--font-display);font-size:20px;margin:0 0 4px;color:var(--navy);}
.onboard-card p{font-size:13px;color:var(--muted);margin:0 0 22px;line-height:1.5;}

.role-pick{display:flex;gap:10px;margin-bottom:4px;}
.role-opt{flex:1;border:1.5px solid var(--line-strong);border-radius:12px;padding:14px 10px;text-align:center;background:#fff;}
.role-opt.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.role-opt svg{width:20px;height:20px;margin-bottom:6px;}
.role-opt .r-name{font-weight:700;font-size:13px;}
.role-opt .r-sub{font-size:10.5px;opacity:.75;margin-top:1px;}

.detail-block{margin-bottom:16px;}
.detail-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EEF0EF;font-size:13.5px;}
.detail-row:last-child{border-bottom:none;}
.detail-row .dk{color:var(--muted);flex-shrink:0;}
.detail-row .dv{font-weight:600;text-align:right;}
.note-box{background:#FBF6EA;border:1px solid #F0DBA9;border-radius:10px;padding:12px 13px;font-size:13px;color:#7A5A08;}
.note-box.rejected{background:#FBEBEA;border-color:#F0BCB9;color:#A32E27;}

.back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}

/* letterhead (matches the paper form's header) */
.letterhead{margin-bottom:16px;}
.letterhead-row{display:flex;justify-content:space-between;gap:14px;}
.lh-col{flex:1;text-align:center;}
.lh-strong{font-size:11px;font-weight:700;color:var(--navy);line-height:1.4;text-transform:uppercase;}
.lh-underline{font-size:11px;font-weight:600;color:var(--navy);text-decoration:underline;margin-top:1px;}
.lh-title{text-align:center;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.4px;margin-top:12px;color:var(--navy);}

/* signature block */
.sig-date{text-align:right;font-size:12.5px;font-style:italic;color:var(--muted);margin-bottom:12px;}
.sig-grid{display:flex;flex-direction:column;gap:16px;}
.sig-block{text-align:center;}
.sig-caption{font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;margin-top:4px;letter-spacing:.3px;}
.sig-name{text-align:center;font-weight:600;margin-bottom:8px;}
.sig-pad-wrap{border:1.5px dashed var(--line-strong);border-radius:10px;background:#FAFBF9;touch-action:none;}
.sig-canvas{display:block;width:100%;height:120px;touch-action:none;}
.sig-readonly{background:#F3F5F3;}
.sig-readonly .sig-canvas{touch-action:auto;}
.sig-reuse-tag{color:var(--teal);font-weight:600;text-transform:none;letter-spacing:0;}
.sig-name:disabled{background:#F3F5F3;color:var(--muted);opacity:1;}
@media print{
  .sig-grid{flex-direction:row;gap:10px;}
  .sig-block{flex:1;}
  .sig-pad-wrap{background:#fff;}
}
.back-btn{background:#fff;border:1.5px solid var(--line-strong);border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back-btn svg{width:17px;height:17px;}
.screen-title{font-family:var(--font-display);font-weight:700;font-size:18px;}

@media print{
  .topbar,.tabbar,.fab,.back-row,.no-print{display:none!important;}
  body{padding:0;background:#fff;}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ======================= CONFIG ======================= */
const LEADER_PIN = "2024"; // Mã PIN để đăng ký vai trò Tổ trưởng — có thể đổi tại đây
const ORG_NAME_1 = "CÔNG TY ĐIỆN LỰC AN GIANG"; // Dòng 1 tiêu đề đơn vị — đổi theo đơn vị của bạn
const ORG_NAME_2 = "ĐIỆN LỰC RẠCH GIÁ";          // Dòng 2 tiêu đề đơn vị
const STATUS_LABEL = {draft:"Nháp", pending:"Chờ duyệt", approved:"Đã duyệt", rejected:"Từ chối"};
const COMMON_MATERIALS = [
  "Điện kế điện tử 1P TT 220V-10-(40)A|Cái",
  "CB 1 pha 2 cực 40A|Cái",
  "Cáp Muller 2*10mm2|mét",
  "Cáp Duplex 2*10mm2|m",
  "Hộp 1 công tơ 1P Composite|Cái",
  "Kẹp rẽ nhánh 95-35|Cái",
  "Ống PVC Phi 27|m",
  "Đai thép 20x0.4mm|m",
  "Khoá đai 20x0.4mm|Cái"
];

/* ======================= STATE ======================= */
let state = {
  profile: null,
  route: "loading",     // loading | onboard | staffList | leaderList | leaderStats | form | detail
  index: [],
  filterStatus: "all",
  filterStaff: "all",
  search: "",
  currentPlan: null,
  toast: null,
  syncing: false,
  onboardDraft: {name:"", role:"staff", pin:""},
  modal: null // {kind:'confirm'|'prompt', message, defaultValue, onOk, onCancel}
};

/* ======================= STORAGE ADAPTER =======================
   Uses Claude's built-in cloud storage (window.storage) when this app
   is running as a Claude Artifact — that is what makes data sync
   between the tablet and the PC over the internet.
   If the file is ever opened directly in a browser (file:// or a plain
   static host) that API does not exist, so we fall back to this
   device's own localStorage instead of crashing. In that fallback mode
   nothing syncs between devices — see the banner in the header. */
const hasCloudSync = (typeof window.storage !== 'undefined');
const storage = hasCloudSync ? window.storage : {
  async get(key, shared){
    const v = localStorage.getItem((shared?'shared:':'local:')+key);
    if(v===null) throw new Error('not found');
    return {key, value:v, shared: !!shared};
  },
  async set(key, value, shared){
    localStorage.setItem((shared?'shared:':'local:')+key, value);
    return {key, value, shared: !!shared};
  },
  async delete(key, shared){
    localStorage.removeItem((shared?'shared:':'local:')+key);
    return {key, deleted:true, shared: !!shared};
  },
  async list(prefix, shared){
    const pfx = (shared?'shared:':'local:') + (prefix||'');
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(pfx)) keys.push(k.slice((shared?'shared:':'local:').length));
    }
    return {keys, prefix, shared: !!shared};
  }
};

/* ======================= STORAGE HELPERS ======================= */
async function loadProfile(){
  try{ const r = await storage.get('profile', false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function saveProfile(p){ await storage.set('profile', JSON.stringify(p), false); }
async function clearProfile(){ try{ await storage.delete('profile', false); }catch(e){} }

async function loadIndex(){
  try{ const r = await storage.get('plans-index', true); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveIndex(arr){ await storage.set('plans-index', JSON.stringify(arr), true); }

async function loadPlan(id){
  try{ const r = await storage.get('plan:'+id, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function savePlanFull(plan){
  state.syncing = true; renderTopbarOnly();
  await storage.set('plan:'+plan.id, JSON.stringify(plan), true);
  let idx = await loadIndex();
  const summary = {
    id: plan.id, ten_khach_hang: plan.ten_khach_hang, dia_chi: plan.dia_chi,
    created_by: plan.created_by, created_at: plan.created_at, updated_at: plan.updated_at,
    status: plan.status, ngay_lap: plan.ngay_lap
  };
  const i = idx.findIndex(p=>p.id===plan.id);
  if(i>=0) idx[i] = summary; else idx.unshift(summary);
  await saveIndex(idx);
  state.index = idx;
  state.syncing = false;
}
async function deletePlanById(id){
  state.syncing = true; renderTopbarOnly();
  try{ await storage.delete('plan:'+id, true); }catch(e){}
  let idx = await loadIndex();
  idx = idx.filter(p=>p.id!==id);
  await saveIndex(idx);
  state.index = idx;
  state.syncing = false;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString('vi-VN') + " " + d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return (parts[parts.length-1][0]||"?").toUpperCase();
}
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2200);
}

/* ======================= MODAL (replaces confirm()/prompt()) =======================
   Native confirm()/prompt() can be silently blocked by the sandboxed
   iframe this app runs in as a Claude Artifact, so all confirmations
   and text-entry prompts use this in-app modal instead. */
function openConfirm(message, onOk){
  state.modal = {kind:'confirm', message, onOk};
  render();
}
function openPrompt(message, defaultValue, onOk){
  state.modal = {kind:'prompt', message, defaultValue: defaultValue||'', onOk};
  render();
}
function closeModal(){ state.modal = null; render(); }

function renderModal(){
  const m = state.modal;
  if(!m) return '';
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <div class="modal-msg">${escapeHtml(m.message)}</div>
      ${m.kind==='prompt' ? `<input class="input" id="modal-input" value="${escapeHtml(m.defaultValue)}" style="margin-top:12px;">` : ''}
      <div class="modal-actions">
        <button class="btn btn-ghost btn-block" id="modal-cancel">Hủy</button>
        <button class="btn btn-primary btn-block" id="modal-ok">${m.kind==='prompt' ? 'Lưu' : 'Xác nhận'}</button>
      </div>
    </div>
  </div>`;
}
function bindModal(){
  const m = state.modal;
  if(!m) return;
  const overlay = document.getElementById('modal-overlay');
  const cancelBtn = document.getElementById('modal-cancel');
  const okBtn = document.getElementById('modal-ok');
  const input = document.getElementById('modal-input');
  if(input){ input.focus(); input.select(); }
  const doCancel = ()=>{ closeModal(); };
  const doOk = async ()=>{
    const val = m.kind==='prompt' ? (input ? input.value : '') : true;
    const cb = m.onOk;
    state.modal = null;
    if(cb) await cb(val);
    render();
  };
  if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay) doCancel(); };
  if(cancelBtn) cancelBtn.onclick = doCancel;
  if(okBtn) okBtn.onclick = doOk;
  if(input) input.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); doOk(); } };
}

/* ======================= RENDER ROOT ======================= */
async function boot(){
  const p = await loadProfile();
  if(p){
    state.profile = p;
    state.syncing = true; render();
    state.index = await loadIndex();
    state.syncing = false;
    state.route = p.role === 'leader' ? 'leaderList' : 'staffList';
  } else {
    state.route = 'onboard';
  }
  render();
}

function renderTopbarOnly(){
  const el = document.getElementById('sync-dot');
  if(el){ el.className = 'sync-dot' + (state.syncing ? ' busy' : ''); }
}

function render(){
  const app = document.getElementById('app');
  if(state.route === 'loading'){
    app.innerHTML = `<div class="center-screen"><div style="color:#fff;font-family:var(--font-display);font-weight:600;">Đang tải…</div></div>`;
    return;
  }
  if(state.route === 'onboard'){ app.innerHTML = viewOnboard(); bindOnboard(); return; }

  let body = "";
  if(state.route === 'staffList') body = viewStaffList();
  else if(state.route === 'leaderList') body = viewLeaderList();
  else if(state.route === 'leaderStats') body = viewLeaderStats();
  else if(state.route === 'form') body = viewForm();
  else if(state.route === 'detail') body = viewDetail();

  app.innerHTML = `
    ${topbar()}
    ${body}
    ${state.route!=='form' ? tabbar() : ""}
    ${(state.route==='staffList') ? fab() : ""}
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ""}
    ${renderModal()}
  `;
  bindGlobal();
  bindModal();
}

  };

/* ======================= SKETCH DRAWING ENGINE =======================
   A lightweight freehand + stamp drawing tool for the "field sketch"
   section. Model per plan: plan.sketch = {paths:[], stamps:[], texts:[]}
   - paths: {points:[{x,y},...], color, width, dash:bool}
   - stamps: {id, type: 'tram'|'tru'|'nha'|'dienke', x, y}
   - texts:  {id, x, y, text}
   A PNG snapshot is kept in plan.sketch_image so the read-only Detail
   view can just show an <img> without re-mounting a live canvas. */
let sketchTool = 'pen';
let sketchCtx = null, sketchCanvasEl = null, sketchDPR = 1;
let sketchDrawingPath = null;
let sketchDragging = null;

function ensureSketchModel(p){
  if(!p.sketch) p.sketch = {paths:[], stamps:[], texts:[]};
  if(!Array.isArray(p.sketch.paths)) p.sketch.paths = [];
  if(!Array.isArray(p.sketch.stamps)) p.sketch.stamps = [];
  if(!Array.isArray(p.sketch.texts)) p.sketch.texts = [];
}

function initSketchCanvas(){
  const canvas = document.getElementById('sketch-canvas');
  if(!canvas) return;
  const p = state.currentPlan;
  ensureSketchModel(p);
  sketchCanvasEl = canvas;
  const rect = canvas.getBoundingClientRect();
  sketchDPR = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * sketchDPR));
  canvas.height = Math.max(1, Math.round(rect.height * sketchDPR));
  sketchCtx = canvas.getContext('2d');
  sketchCtx.setTransform(sketchDPR,0,0,sketchDPR,0,0);
  sketchRedraw();
  sketchSnapshot();

  document.querySelectorAll('.stool').forEach(btn=>{
    btn.onclick = ()=>{
      sketchTool = btn.dataset.tool;
      document.querySelectorAll('.stool').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  canvas.onpointerdown = sketchPointerDown;
  canvas.onpointermove = sketchPointerMove;
  canvas.onpointerup = sketchPointerUp;
  canvas.onpointerleave = sketchPointerUp;

  const undoBtn = document.getElementById('btn-sketch-undo');
  if(undoBtn) undoBtn.onclick = ()=>{
    const s = state.currentPlan.sketch;
    const last = [
      {arr:s.paths, t: s.paths.length? s.paths[s.paths.length-1]._t:0},
      {arr:s.stamps, t: s.stamps.length? s.stamps[s.stamps.length-1]._t:0},
      {arr:s.texts, t: s.texts.length? s.texts[s.texts.length-1]._t:0}
    ].sort((a,b)=>b.t-a.t)[0];
    if(last && last.arr.length) last.arr.pop();
    sketchRedraw(); sketchSnapshot();
  };
  const clearBtn = document.getElementById('btn-sketch-clear');
  if(clearBtn) clearBtn.onclick = ()=>{
    openConfirm('Xóa toàn bộ sơ đồ đã vẽ?', ()=>{
      state.currentPlan.sketch = {paths:[], stamps:[], texts:[]};
    });
  };
  const tplBtn = document.getElementById('btn-sketch-template');
  if(tplBtn) tplBtn.onclick = ()=>{
    const s = state.currentPlan.sketch;
    if(s.paths.length||s.stamps.length||s.texts.length){
      openConfirm('Chèn sơ đồ mẫu sẽ thay thế hình đang vẽ. Tiếp tục?', ()=> insertSketchTemplate());
    } else {
      insertSketchTemplate();
    }
  };
}

function sketchPoint(e){
  const rect = sketchCanvasEl.getBoundingClientRect();
  return {x: e.clientX-rect.left, y: e.clientY-rect.top};
}
function sketchStampAt(pt){
  const s = state.currentPlan.sketch;
  for(let i=s.stamps.length-1;i>=0;i--){
    const st = s.stamps[i];
    if(Math.hypot(st.x-pt.x, st.y-pt.y) < 22) return st;
  }
  return null;
}
function sketchTextAt(pt){
  const s = state.currentPlan.sketch;
  for(let i=s.texts.length-1;i>=0;i--){
    const tx = s.texts[i];
    if(Math.abs(tx.x-pt.x)<40 && Math.abs(tx.y-pt.y)<14) return tx;
  }
  return null;
}
function sketchNearestElement(pt){
  const s = state.currentPlan.sketch;
  let best=null, bestD=26;
  s.stamps.forEach(st=>{ const d=Math.hypot(st.x-pt.x,st.y-pt.y); if(d<bestD){bestD=d;best={arr:s.stamps,item:st};} });
  s.texts.forEach(tx=>{ const d=Math.hypot(tx.x-pt.x,tx.y-pt.y); if(d<bestD){bestD=d;best={arr:s.texts,item:tx};} });
  s.paths.forEach(pa=>{
    for(const pt2 of pa.points){ const d=Math.hypot(pt2.x-pt.x,pt2.y-pt.y); if(d<bestD){bestD=d;best={arr:s.paths,item:pa};} }
  });
  return best;
}
function sketchPointerDown(e){
  e.preventDefault();
  const pt = sketchPoint(e);
  const p = state.currentPlan;
  if(sketchTool==='eraser'){
    const hit = sketchNearestElement(pt);
    if(hit){ const idx = hit.arr.indexOf(hit.item); if(idx>-1) hit.arr.splice(idx,1); sketchRedraw(); sketchSnapshot(); }
    return;
  }
  const hitStamp = sketchStampAt(pt);
  if(hitStamp){ sketchDragging = {kind:'stamp', ref:hitStamp}; return; }
  const hitText = sketchTextAt(pt);
  if(hitText){ sketchDragging = {kind:'text', ref:hitText}; return; }

  if(sketchTool==='pen'){
    sketchDrawingPath = {points:[pt], color:'#122A4A', width:2.5, dash:false, kind:'pen', _t:Date.now()};
    return;
  }
  if(sketchTool==='road'){
    sketchDrawingPath = {points:[pt], color:'#8C9AA3', width:7, dash:false, kind:'road', _t:Date.now()};
    return;
  }
  if(sketchTool==='wire'){
    sketchDrawingPath = {points:[pt], color:'#F5A623', width:3, dash:true, kind:'wire', _t:Date.now()};
    return;
  }
  if(['tram','tru','nha','dienke'].includes(sketchTool)){
    p.sketch.stamps.push({id:uid(), type:sketchTool, x:pt.x, y:pt.y, _t:Date.now()});
    sketchRedraw(); sketchSnapshot();
    return;
  }
  if(sketchTool==='text'){
    openPrompt('Nội dung ghi chú (VD: 140m, kiểm tra dây nhánh...):', '', (label)=>{
      if(label && label.trim()){
        p.sketch.texts.push({id:uid(), x:pt.x, y:pt.y, text:label.trim(), _t:Date.now()});
      }
    });
  }
}
function sketchPointerMove(e){
  if(sketchDragging){
    const pt = sketchPoint(e);
    sketchDragging.ref.x = pt.x; sketchDragging.ref.y = pt.y;
    sketchRedraw();
    return;
  }
  if(sketchDrawingPath){
    const pt = sketchPoint(e);
    if(sketchDrawingPath.kind==='pen') sketchDrawingPath.points.push(pt);
    else sketchDrawingPath.points = [sketchDrawingPath.points[0], pt]; // straight line for road/wire
    sketchRedraw(true);
  }
}
function sketchPointerUp(e){
  if(sketchDragging){ sketchDragging=null; sketchSnapshot(); return; }
  if(sketchDrawingPath){
    const path = sketchDrawingPath;
    sketchDrawingPath = null;
    if(path.points.length>1){
      state.currentPlan.sketch.paths.push(path);
      sketchRedraw(); sketchSnapshot();
      if(path.kind==='road' || path.kind==='wire'){
        const a=path.points[0], b=path.points[path.points.length-1];
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2-10;
        openPrompt('Số mét / ghi chú cho đoạn này (để trống nếu bỏ qua):', '', (label)=>{
          if(label && label.trim()){
            state.currentPlan.sketch.texts.push({id:uid(), x:mx, y:my, text:label.trim(), _t:Date.now()});
          }
        });
      }
      return;
    }
    sketchRedraw(); sketchSnapshot();
  }
}

function sketchDrawIcon(ctx, type, x, y){
  ctx.save();
  ctx.translate(x,y);
  ctx.font='600 9px Inter, sans-serif';
  ctx.textAlign='center';
  if(type==='tram'){
    ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fillStyle='#122A4A'; ctx.fill();
    ctx.fillStyle='#F5A623'; ctx.font='11px sans-serif'; ctx.fillText('⚡',0,4);
    ctx.fillStyle='#122A4A'; ctx.font='600 9px Inter, sans-serif'; ctx.fillText('Trạm',0,26);
  } else if(type==='tru'){
    ctx.strokeStyle='#5B6B7A'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(0,14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,-9); ctx.lineTo(8,-9); ctx.moveTo(-7,-2); ctx.lineTo(7,-2); ctx.stroke();
    ctx.fillStyle='#122A4A'; ctx.fillText('Trụ',0,26);
  } else if(type==='dienke'){
    ctx.fillStyle='#F5A623'; roundRectPath(ctx,-12,-12,24,24,5); ctx.fill();
    ctx.strokeStyle='#8A5A08'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#122A4A'; ctx.fillText('Điện kế',0,26);
  } else if(type==='nha'){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#122A4A'; ctx.lineWidth=2;
    roundRectPath(ctx,-14,-11,28,22,4); ctx.fill(); ctx.stroke();
    ctx.font='13px sans-serif'; ctx.fillText('🏠',0,5);
    ctx.fillStyle='#122A4A'; ctx.font='600 9px Inter, sans-serif'; ctx.fillText('Nhà KH',0,28);
  }
  ctx.restore();
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function sketchDrawText(ctx, tx){
  ctx.font='700 11px "IBM Plex Mono", monospace';
  const w = ctx.measureText(tx.text).width;
  ctx.fillStyle='rgba(255,255,255,.92)';
  roundRectPath(ctx, tx.x-w/2-6, tx.y-13, w+12, 18, 5); ctx.fill();
  ctx.strokeStyle='#DBE1E2'; ctx.lineWidth=1; roundRectPath(ctx, tx.x-w/2-6, tx.y-13, w+12, 18, 5); ctx.stroke();
  ctx.fillStyle='#8A5A08'; ctx.textAlign='center'; ctx.fillText(tx.text, tx.x, tx.y);
}
function sketchRedraw(liveOnly){
  if(!sketchCtx) return;
  const canvas = sketchCanvasEl;
  const w = canvas.width / sketchDPR, h = canvas.height / sketchDPR;
  const ctx = sketchCtx;
  ctx.clearRect(0,0,w,h);
  // subtle background grid, like graph/survey paper
  ctx.strokeStyle = '#E9EDEC'; ctx.lineWidth = 1;
  for(let gx=0; gx<w; gx+=24){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
  for(let gy=0; gy<h; gy+=24){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }

  const s = state.currentPlan.sketch;
  const allPaths = liveOnly && sketchDrawingPath ? [...s.paths, sketchDrawingPath] : s.paths;
  allPaths.forEach(path=>{
    if(path.points.length<2) return;
    ctx.beginPath();
    ctx.moveTo(path.points[0].x, path.points[0].y);
    for(let i=1;i<path.points.length;i++) ctx.lineTo(path.points[i].x, path.points[i].y);
    ctx.strokeStyle = path.color; ctx.lineWidth = path.width;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.setLineDash(path.dash ? [8,6] : []);
    ctx.stroke();
    ctx.setLineDash([]);
  });
  s.stamps.forEach(st=> sketchDrawIcon(ctx, st.type, st.x, st.y));
  s.texts.forEach(tx=> sketchDrawText(ctx, tx));
}
function sketchSnapshot(){
  if(!sketchCanvasEl) return;
  try{ state.currentPlan.sketch_image = sketchCanvasEl.toDataURL('image/png'); }catch(e){}
}
function insertSketchTemplate(){
  const p = state.currentPlan;
  const canvas = sketchCanvasEl;
  const w = canvas.width/sketchDPR, h = canvas.height/sketchDPR;
  const meterAtPole = p.vi_tri_dien_ke !== 'nha';
  const yMid = h*0.55;
  const xTram = w*0.14, xMeter = meterAtPole ? w*0.48 : null, xHouse = w*0.86;
  const stamps = [{id:uid(),type:'tram',x:xTram,y:yMid,_t:Date.now()}];
  const paths = [];
  const texts = [{id:uid(), x:w/2, y:h*0.12, text:`${p.tram_dau_noi||'Trạm'} · Pha ${p.pha_dau_noi||''} · ${p.cong_suat_dat||'?'} KVA`, _t:Date.now()}];
  if(meterAtPole){
    paths.push({points:[{x:xTram+16,y:yMid},{x:xMeter-14,y:yMid}], color:'#F5A623', width:3, dash:true, kind:'wire', _t:Date.now()});
    stamps.push({id:uid(),type:'dienke',x:xMeter,y:yMid,_t:Date.now()});
    paths.push({points:[{x:xMeter+14,y:yMid},{x:xHouse-16,y:yMid}], color:'#B9C3C6', width:2.5, dash:false, kind:'wire', _t:Date.now()});
    texts.push({id:uid(), x:(xTram+xMeter)/2, y:yMid-14, text:(p.khoang_cach_tru||'?')+' m', _t:Date.now()});
  } else {
    paths.push({points:[{x:xTram+16,y:yMid},{x:xHouse-16,y:yMid}], color:'#F5A623', width:3, dash:true, kind:'wire', _t:Date.now()});
    texts.push({id:uid(), x:(xTram+xHouse)/2, y:yMid-14, text:(p.khoang_cach_tru||'?')+' m', _t:Date.now()});
  }
  stamps.push({id:uid(),type:'nha',x:xHouse,y:yMid,_t:Date.now()});
  p.sketch = {paths, stamps, texts};
  sketchRedraw(); sketchSnapshot();
}

function bindFormEvents(){
  initSketchCanvas();
  document.querySelectorAll('[data-f]').forEach(el=>{
    el.oninput = e=>{ state.currentPlan[el.dataset.f] = e.target.value; if(el.tagName==='SELECT') render(); };
    el.onchange = e=>{ if(el.tagName==='SELECT'){ state.currentPlan[el.dataset.f] = e.target.value; render(); } };
  });
  document.querySelectorAll('[data-choice]').forEach(el=>{
    el.onclick = ()=>{
      const [field,val] = el.dataset.choice.split(':');
      state.currentPlan[field] = val;
      render();
    };
  });
  document.querySelectorAll('[data-mat]').forEach(el=>{
    el.oninput = e=>{
      const [idx,key] = el.dataset.mat.split(':');
      const map = {ten:'ten', dvt:'dvt', sl:'sl'};
      state.currentPlan.vat_tu[idx][map[key]] = e.target.value;
    };
  });
  document.querySelectorAll('[data-matdel]').forEach(el=>{
    el.onclick = ()=>{ state.currentPlan.vat_tu.splice(+el.dataset.matdel,1); render(); };
  });
  document.querySelectorAll('[data-quickmat]').forEach(el=>{
    el.onclick = ()=>{
      const [ten,dvt] = el.dataset.quickmat.split('|');
      state.currentPlan.vat_tu.push({ten,dvt,sl:'1'});
      render();
    };
  });
  const addMatBtn = document.getElementById('btn-add-mat');
  if(addMatBtn) addMatBtn.onclick = ()=>{ state.currentPlan.vat_tu.push({ten:'',dvt:'',sl:''}); render(); };

  const gpsBtn = document.getElementById('btn-gps');
  if(gpsBtn) gpsBtn.onclick = ()=>{
    if(!navigator.geolocation){ showToast('Thiết bị không hỗ trợ định vị GPS'); return; }
    gpsBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(pos=>{
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      state.currentPlan.gps_toa_do = `${lat},${lng}`;
      render();
    }, err=>{ showToast('Không lấy được vị trí — vui lòng nhập tay'); gpsBtn.disabled=false; }, {enableHighAccuracy:true, timeout:8000});
  };

  const saveDraft = document.getElementById('btn-save-draft');
  if(saveDraft) saveDraft.onclick = async ()=>{
    if(!validatePlan()) return;
    state.currentPlan.status = state.currentPlan.status==='draft' ? 'draft' : state.currentPlan.status;
    state.currentPlan.updated_at = nowISO();
    ensureSignatures(state.currentPlan);
    applyOwnerSignature('nguoi_lap');
    await savePlanFull(state.currentPlan);
    showToast('Đã lưu nháp');
    state.route = 'staffList';
    render();
  };
  const submitBtn = document.getElementById('btn-submit-plan');
  if(submitBtn) submitBtn.onclick = async ()=>{
    if(!validatePlan()) return;
    state.currentPlan.status = 'pending';
    state.currentPlan.updated_at = nowISO();
    state.currentPlan.leader_note = '';
    ensureSignatures(state.currentPlan);
    applyOwnerSignature('nguoi_lap');
    await savePlanFull(state.currentPlan);
    showToast('Đã gửi phương án chờ duyệt');
    state.route = 'staffList';
    render();
  };
}
function validatePlan(){
  const p = state.currentPlan;
  if(!p.ten_khach_hang || !p.ten_khach_hang.trim()){ showToast('Vui lòng nhập tên khách hàng'); return false; }
  return true;
}

function renderLetterhead(){

      </div>
    </div>

function vnDateLine(dateStr){
  const d = dateStr ? new Date(dateStr+'T00:00:00') : new Date();
  if(isNaN(d.getTime())) return 'ngày ... tháng ... năm ......';
  return `ngày ${d.getDate()} tháng ${d.getMonth()+1} năm ${d.getFullYear()}`;
}
const PAD_OWNER_ROLE = {nguoi_lap:'staff', duyet:'leader', khach_hang:null}; // null = ký lại mỗi lần (khách hàng)

function ensureSignatures(p){
  if(!p.signatures) p.signatures = {};
  ['duyet','khach_hang','nguoi_lap'].forEach(k=>{
    if(!p.signatures[k]) p.signatures[k] = {paths:[], name:''};
    if(!Array.isArray(p.signatures[k].paths)) p.signatures[k].paths = [];
  });
}
function ensureProfileSignature(){
  if(state.profile && !state.profile.signature) state.profile.signature = {paths:[], name:''};
}
function hasStrokes(sig){ return !!(sig && sig.paths && sig.paths.length>0); }

/* Copy the current account's saved reusable signature onto this plan
   (used automatically when saving/submitting/approving, so staff and
   the leader only ever have to draw their signature once). */
function applyOwnerSignature(key){
  const ownerRole = PAD_OWNER_ROLE[key];
  if(!ownerRole || !state.profile || state.profile.role !== ownerRole) return;
  ensureProfileSignature();
  if(!hasStrokes(state.profile.signature)) return;
  ensureSignatures(state.currentPlan);
  const copy = JSON.parse(JSON.stringify(state.profile.signature));
  if(!copy.name) copy.name = state.profile.name;
  state.currentPlan.signatures[key] = copy;
}

function isPadOwnedByMe(p, key){
  const ownerRole = PAD_OWNER_ROLE[key];
  if(!ownerRole || !state.profile || state.profile.role !== ownerRole) return false;
  if(key==='nguoi_lap') return p.created_by === state.profile.name;
  return true; // 'duyet': any tổ trưởng account may sign
}
function sigDefaultName(p, key, sig){
  if(sig.name) return sig.name;
  if(key==='nguoi_lap') return p.created_by || '';
  if(key==='duyet') return p.approved_by || (isPadOwnedByMe(p,'duyet') ? state.profile.name : '');
  return '';
}
function sigBlockHTML(p, key, label){
  const sig = p.signatures[key];
  const ownerRole = PAD_OWNER_ROLE[key];
  const isReusable = !!ownerRole;
  const isMine = isPadOwnedByMe(p, key);
  const readOnly = isReusable && !isMine;
  const defaultName = sigDefaultName(p, key, sig);
  const signed = hasStrokes(sig);
  return `
  <div class="sig-block">
    <input class="input sig-name" data-signame="${key}" placeholder="Họ và tên" value="${escapeHtml(defaultName)}" ${readOnly?'disabled':''}>
    <div class="sig-pad-wrap ${readOnly?'sig-readonly':''}"><canvas id="sig-canvas-${key}" class="sig-canvas" data-editable="${readOnly?0:1}"></canvas></div>
    <div class="sig-caption">${label}${isReusable?' <span class="sig-reuse-tag">· ký 1 lần, dùng mãi</span>':''}</div>
    ${readOnly
      ? (signed ? `` : `<div class="hint" style="margin-top:4px;">Chưa ký (tài khoản ${ownerRole==='staff'?'nhân viên':'tổ trưởng'} tương ứng sẽ tự điền)</div>`)
      : `<button class="btn btn-ghost btn-sm no-print" data-sigclear="${key}" type="button" style="margin-top:6px;">${isReusable ? 'Ký lại từ đầu' : 'Xóa chữ ký'}</button>`}
  </div>`;
}
function renderSignatureSection(p){
  ensureSignatures(p);
  return `
  <div class="section-title"><span class="num">✎</span>Chữ ký</div>
  <div class="card">
    <div class="sig-date">Rạch Giá, ${vnDateLine(p.ngay_lap)}</div>
    <div class="sig-grid">
      ${sigBlockHTML(p,'duyet','Duyệt')}

}

function detailRow(k,v){

function buildPlanText(p){
  const L = [];
  L.push('PHƯƠNG ÁN CUNG CẤP ĐIỆN');
  L.push('— Khách hàng —');
  L.push(`Tên khách hàng: ${p.ten_khach_hang||'—'}`);
  L.push(`Điện thoại: ${p.sdt||'—'}`);
  L.push(`Danh số liền kề: ${p.danh_so_lien_ke||'—'}`);
  L.push(`Địa chỉ: ${p.dia_chi||'—'}`);
  L.push('');
  L.push('— Thông số kỹ thuật —');
  L.push(`Mục đích sử dụng: ${p.muc_dich} · Số hộ dùng chung: ${p.so_ho_dung_chung} · Loại nhà: ${p.loai_nha}`);
  L.push(`Trạm đấu nối: ${p.tram_dau_noi||'—'}`);
  L.push(`Công suất: ${p.cong_suat_dat||'?'} KVA · I_ĐM: ${p.i_dm||'?'} A · I_MAX: ${p.i_max||'?'} · Pha: ${p.pha_dau_noi}`);
  L.push(`Vị trí điện kế: ${p.vi_tri_dien_ke==='nha' ? 'Trong phạm vi nhà KH' : 'Gắn ngoài cột'}`);
  L.push(`Tọa độ GPS: ${p.gps_toa_do||'—'} · Khoảng cách đến trụ điện: ${p.khoang_cach_tru||'—'} m`);
  if(p.ghi_chu_so_do) L.push(`Ghi chú sơ đồ: ${p.ghi_chu_so_do}`);
  L.push('');
  L.push('— Nhận xét khảo sát —');
  L.push(`Phụ tải trạm: ${p.phu_tai==='du'?'Đủ khả năng':'Không đủ khả năng'}`);
  L.push(`Khoảng cách trạm đến điểm cấp điện: ${p.khoang_cach_tram||'—'} m (${p.khoang_cach_dat==='co'?'đảm bảo':'không đảm bảo'})`);
  L.push(`Chất lượng điện áp: ${p.chat_luong_ap||'—'} V (${p.dien_ap_dat==='co'?'đảm bảo':'không đảm bảo'})`);
  L.push(`Giấy ưng thuận câu chuyển bổ sung: ${p.giay_ung_thuan==='co'?'Có':'Không'}`);
  L.push(`Độ cao đến điểm thấp nhất dây: ${p.do_cao_day||'—'} m · Cần trụ đỡ: ${p.can_tru_do==='co' ? ('Có, '+(p.tru_do_met||'?')+' m') : 'Không'}`);
  L.push('');
  L.push('— Vật tư dự trù —');
  if(p.vat_tu && p.vat_tu.length){
    p.vat_tu.forEach(r=> L.push(`- ${r.ten||'—'}: ${r.sl||''} ${r.dvt||''}`));
  } else {
    L.push('(không có)');
  }
  L.push('');
  L.push(`Kết luận: ${p.ket_luan==='dong_y' ? 'Đồng ý lắp đặt' : ('Không đồng ý — '+(p.ly_do_khong_dong_y||''))}`);
  L.push(`Người lập: ${p.created_by||'—'} · Ngày lập: ${p.ngay_lap||'—'}`);
  if(p.status==='approved') L.push(`Đã duyệt bởi: ${p.approved_by||''} lúc ${fmtDate(p.approved_at)}${p.leader_note? (' — '+p.leader_note) : ''}`);
  if(p.status==='rejected') L.push(`Bị từ chối bởi: ${p.approved_by||''} — Lý do: ${p.leader_note||''}`);
  return L.join('\n');
}

function copyPlanText(){
  const text = buildPlanText(state.currentPlan);
  const finish = (ok)=> showToast(ok ? 'Đã sao chép nội dung phương án' : 'Không sao chép được ở đây — hãy mở file này ngoài Claude để dùng chức năng này');
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  if(ok){ finish(true); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>finish(true)).catch(()=>finish(false));
  } else {
    finish(false);
  }
}

function tryPrint(){
  const inPreview = (window.self !== window.top);
  if(inPreview){
    showToast('Không in được trong khung xem trước — hãy mở file này ở một tab trình duyệt riêng để in.');
  }
  try{ window.print(); }catch(e){}
}

/* ======================= SIGNATURE PADS =======================
   Three independent small freehand canvases: Duyệt / Khách hàng /
   Người lập phương án. Simpler than the field sketch — just strokes,
   no stamps or text, each stored under plan.signatures[key].paths. */
let sigCtx = {}, sigCanvasEl = {};
function sigPoint(canvas, e){
  const r = canvas.getBoundingClientRect();
  return {x: e.clientX-r.left, y: e.clientY-r.top};
}
function sigRedraw(key){
  const ctx = sigCtx[key], canvas = sigCanvasEl[key];
  if(!ctx || !canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = '#122A4A'; ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  const paths = state.currentPlan.signatures[key].paths;
  paths.forEach(path=>{
    if(path.length<2) return;
    ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
    for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x, path[i].y);
    ctx.stroke();
  });
}
function initSignaturePads(){
  const p = state.currentPlan;
  ensureSignatures(p);
  ensureProfileSignature();
  ['duyet','khach_hang','nguoi_lap'].forEach(key=>{
    const canvas = document.getElementById('sig-canvas-'+key);
    if(!canvas) return;
    const editable = canvas.dataset.editable === '1';
    const isMine = isPadOwnedByMe(p, key);

    // Auto-fill this plan's copy from the saved reusable signature, if any.
    if(isMine && hasStrokes(state.profile.signature) && !hasStrokes(p.signatures[key])){
      p.signatures[key] = JSON.parse(JSON.stringify(state.profile.signature));
      if(!p.signatures[key].name) p.signatures[key].name = state.profile.name;
    }

    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width*dpr));
    canvas.height = Math.max(1, Math.round(rect.height*dpr));
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    sigCtx[key] = ctx; sigCanvasEl[key] = canvas;
    sigRedraw(key);

    if(!editable) return; // read-only pad: display only, no drawing wired

    let live = null;
    canvas.onpointerdown = e=>{ e.preventDefault(); live = [sigPoint(canvas,e)]; };
    canvas.onpointermove = e=>{
      if(!live) return;
      live.push(sigPoint(canvas,e));
      sigRedraw(key);
      const ctx2 = sigCtx[key];
      ctx2.beginPath(); ctx2.moveTo(live[0].x, live[0].y);
      for(let i=1;i<live.length;i++) ctx2.lineTo(live[i].x, live[i].y);
      ctx2.strokeStyle='#122A4A'; ctx2.lineWidth=2.2; ctx2.lineCap='round'; ctx2.lineJoin='round'; ctx2.stroke();
    };
    const finish = async ()=>{
      if(live && live.length>1){
        state.currentPlan.signatures[key].paths.push(live);
        // For reusable pads (staff/leader own signature), keep the account's
        // saved signature in sync so it's reused automatically next time.
        if(PAD_OWNER_ROLE[key] && isMine){
          const wasEmpty = !hasStrokes(state.profile.signature);
          const copy = JSON.parse(JSON.stringify(state.currentPlan.signatures[key]));
          if(!copy.name) copy.name = state.profile.name;
          state.profile.signature = copy;
          await saveProfile(state.profile);
          if(wasEmpty) showToast('Đã lưu chữ ký của bạn — tự động dùng lại cho các phương án sau');
        }
      }
      live = null;
      sigRedraw(key);
    };
    canvas.onpointerup = finish;
    canvas.onpointerleave = finish;
  });
  document.querySelectorAll('[data-sigclear]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.sigclear;
      const ownerRole = PAD_OWNER_ROLE[key];
      if(ownerRole){
        openConfirm('Xóa chữ ký đã lưu cho tài khoản này và ký lại từ đầu?', async ()=>{
          state.currentPlan.signatures[key] = {paths:[], name:''};
          state.profile.signature = {paths:[], name:''};
          await saveProfile(state.profile);
        });
      } else {
        openConfirm('Xóa chữ ký này?', ()=>{ state.currentPlan.signatures[key].paths = []; });
      }
    };
  });
  document.querySelectorAll('[data-signame]').forEach(inp=>{
    inp.oninput = e=>{ state.currentPlan.signatures[inp.dataset.signame].name = e.target.value; };
  });
}

function bindDetailEvents(){
  initSignaturePads();
  const editBtn = document.getElementById('btn-edit-plan');
  if(editBtn) editBtn.onclick = ()=>{ state.route='form'; render(); };
  const printBtn = document.getElementById('btn-print-plan');
  if(printBtn) printBtn.onclick = tryPrint;
  const copyBtn = document.getElementById('btn-copy-plan');
  if(copyBtn) copyBtn.onclick = copyPlanText;
  const approveBtn = document.getElementById('btn-approve');
  if(approveBtn) approveBtn.onclick = async ()=>{
    const note = document.getElementById('leader-note-input').value;
    state.currentPlan.status='approved';
    state.currentPlan.approved_by = state.profile.name;
    state.currentPlan.approved_at = nowISO();
    state.currentPlan.leader_note = note;
    state.currentPlan.updated_at = nowISO();
    ensureSignatures(state.currentPlan);
    applyOwnerSignature('duyet');
    await savePlanFull(state.currentPlan);
    showToast('Đã duyệt phương án');
    state.route='leaderList'; render();
  };
  const rejectBtn = document.getElementById('btn-reject');
  if(rejectBtn) rejectBtn.onclick = async ()=>{
    const note = document.getElementById('leader-note-input').value;
    if(!note || !note.trim()){ showToast('Vui lòng nhập lý do từ chối'); return; }
    state.currentPlan.status='rejected';
    state.currentPlan.approved_by = state.profile.name;
    state.currentPlan.approved_at = nowISO();
    state.currentPlan.leader_note = note;
    state.currentPlan.updated_at = nowISO();
    await savePlanFull(state.currentPlan);
    showToast('Đã từ chối phương án');
    state.route='leaderList'; render();
  };
}

/* ======================= GLOBAL BINDINGS ======================= */
function bindGlobal(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ state.route = el.dataset.nav; render(); };
  });
  const newBtn = document.getElementById('fab-new');
  if(newBtn) newBtn.onclick = openNewPlan;
  const newBtn2 = document.querySelector('[data-newplan]');
  if(newBtn2) newBtn2.onclick = openNewPlan;

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = async ()=>{
      state.syncing = true; render();
      const plan = await loadPlan(el.dataset.open);
      state.syncing = false;
      if(!plan){ showToast('Không tải được phương án'); render(); return; }
      state.currentPlan = plan;
      state.route = 'detail';
      render();
    };
  });

  const logoutChip = document.getElementById('btn-logout');
  if(logoutChip) logoutChip.onclick = ()=>{
    openConfirm('Đổi người dùng trên thiết bị này? Bạn sẽ cần đăng nhập lại.', async ()=>{
      await clearProfile();
      state.profile = null;
      state.route = 'onboard';
      state.onboardDraft = {name:"",role:"staff",pin:""};
    });
  };

  const statusFilters = document.querySelectorAll('[data-filter]');
  statusFilters.forEach(el=>{
    el.onclick = ()=>{ state.filterStatus = el.dataset.filter; render(); };
  });
  const staffFilter = document.getElementById('staff-filter');
  if(staffFilter) staffFilter.onchange = e=>{ state.filterStaff = e.target.value; render(); };

  if(state.route==='form') bindFormEvents();
  if(state.route==='detail') bindDetailEvents();
}

function openNewPlan(){
  state.currentPlan = blankPlan();
  state.route = 'form';
  render();
}

/* ======================= UTIL ======================= */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeXml(str){ return escapeHtml(str); }

boot();
</script>
