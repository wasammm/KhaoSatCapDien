<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mô Phỏng Quỹ Đạo Mặt Trời 3D</title>
  
  <!-- Thư viện Three.js, OrbitControls & SunCalc -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      touch-action: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Nút Toggle Ẩn/Hiện Panel trên Mobile */
    #toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #222;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* Bảng điều khiển chung */
    #ui-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      color: #333;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }

    #ui-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }

    h2 { 
      margin: 0 0 12px 0; 
      font-size: 1.1rem; 
      color: #111; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
    }

    .control-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; }
    
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #ddd;
      outline: none;
    }

    input[type="date"] {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
      background: #fff;
    }

    /* Toggle Autoplay Checkbox */
    .autoplay-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #e0f2fe;
      color: #0369a1;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }
    .autoplay-box input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .metrics {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .legend {
      margin-top: 10px;
      font-size: 0.78rem;
    }
    .legend div { display: flex; align-items: center; margin-bottom: 4px; }
    .color-box { width: 10px; height: 10px; margin-right: 8px; border-radius: 2px;}

    /* RESPONSIVE DESIGN CHO ĐIỆN THOẠI DI ĐỘNG */
    @media (max-width: 600px) {
      #ui-panel {
        top: auto;
        bottom: 15px;
        left: 15px;
        right: 15px;
        width: auto;
        max-height: 60vh;
        padding: 14px;
      }
      #ui-panel.hidden {
        transform: translateY(100%);
      }
    }
  </style>
</head>
<body>

  <button id="toggle-btn">👁️ Ẩn/Hiện Bảng Điều Khiển</button>

  <div id="canvas-container"></div>

  <div id="ui-panel">
    <h2>Trục Thời Gian Mặt Trời</h2>
    
    <div class="control-group">
      <label for="date-input">Ngày trong năm:</label>
      <input type="date" id="date-input">
    </div>

    <div class="control-group">
      <label for="time-slider">Thời gian: <span id="time-display" style="color:#0284c7;">12:00</span></label>
      <input type="range" id="time-slider" min="0" max="1440" value="720">
    </div>

    <div class="control-group">
      <label class="autoplay-box">
        <input type="checkbox" id="autoplay-checkbox">
        <span>▶ Tự động chạy theo thời gian</span>
      </label>
    </div>

    <div class="metrics">
      <div><strong>Tọa độ:</strong> Vĩ độ 10.77°, Kinh độ 106.70° (TP.HCM)</div>
      <div><strong>Góc nghiêng (Altitude):</strong> <span id="val-alt">0</span>°</div>
      <div><strong>Góc phương vị (Azimuth):</strong> <span id="val-az">0</span>°</div>
    </div>

    <div class="legend">
      <strong>Chú giải quỹ đạo:</strong>
      <div><span class="color-box" style="background: #ff5722;"></span> Hạ chí (Tháng 6 - Cao nhất)</div>
      <div><span class="color-box" style="background: #4caf50;"></span> Xuân/Thu phân (Tháng 3, 9)</div>
      <div><span class="color-box" style="background: #2196f3;"></span> Đông chí (Tháng 12 - Thấp nhất)</div>
    </div>
  </div>

  <script>
    // 1. THÔNG SỐ VỊ TRÍ & KHỞI TẠO
    const LAT = 10.7769; 
    const LON = 106.7009; 
    const SUN_RADIUS = 50; 

    let currentDate = new Date();
    document.getElementById('date-input').value = currentDate.toISOString().split('T')[0];

    // 2. SCENE THREE.JS & TỐI ƯU HÌNH ẢNH MOBILE
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(35, 25, 55);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Tối ưu hiển thị sắc nét trên Retina/OLED mobile
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true; 
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.05;

    // 3. MÔI TRƯỜNG & ĐỐI TƯỢNG
    const groundGeo = new THREE.CylinderGeometry(SUN_RADIUS, SUN_RADIUS, 0.5, 64);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3d6a45, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -0.25;
    ground.receiveShadow = true;
    scene.add(ground);

    const gridHelper = new THREE.PolarGridHelper(SUN_RADIUS, 16, 8, 64, 0x000000, 0x888888);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // Người quan sát ở trung tâm
    const personGeo = new THREE.CylinderGeometry(0.4, 0.4, 3.5, 16);
    const personMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const person = new THREE.Mesh(personGeo, personMat);
    person.position.y = 1.75; 
    person.castShadow = true;
    scene.add(person);

    // Nhãn la bàn Tiếng Việt
    function addCompassLabel(text, position) {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
      ctx.shadowBlur = 4;
      ctx.fillStyle = 'white';
      ctx.font = 'Bold 32px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(text, 64, 45); 
      
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.position.copy(position);
      sprite.scale.set(8, 4, 1); 
      scene.add(sprite);
    }

    addCompassLabel('Bắc', new THREE.Vector3(0, 1, -SUN_RADIUS + 3)); 
    addCompassLabel('Nam', new THREE.Vector3(0, 1, SUN_RADIUS - 3));  
    addCompassLabel('Đông', new THREE.Vector3(SUN_RADIUS - 3, 1, 0));  
    addCompassLabel('Tây', new THREE.Vector3(-SUN_RADIUS + 3, 1, 0)); 

    // Mặt trời & Ánh sáng
    const sunGeo = new THREE.SphereGeometry(2.5, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sunMesh);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    sunLight.shadow.camera.left = -50;
    sunLight.shadow.camera.right = 50;
    sunLight.shadow.camera.top = 50;
    sunLight.shadow.camera.bottom = -50;
    scene.add(sunLight);

    const ambientLight = new THREE.AmbientLight(0x555555, 0.6);
    scene.add(ambientLight);

    // 4. HÀM TÍNH TOÁN VỊ TRÍ & QUỸ ĐẠO
    function getSunPosition(date) {
      const pos = SunCalc.getPosition(date, LAT, LON);
      const phi = pos.altitude;
      const theta = pos.azimuth;

      const z = SUN_RADIUS * Math.cos(phi) * Math.cos(theta);
      const x = SUN_RADIUS * Math.cos(phi) * -Math.sin(theta);
      const y = SUN_RADIUS * Math.sin(phi);

      return { x, y, z, altitude: phi, azimuth: theta };
    }

    function drawSunPath(dateStr, color) {
      const points = [];
      const baseDate = new Date(dateStr);
      for (let i = 0; i <= 24 * 60; i += 10) { 
        const d = new Date(baseDate);
        d.setHours(0, i, 0, 0);
        const pos = getSunPosition(d);
        if (pos.y >= -2) { 
          points.push(new THREE.Vector3(pos.x, pos.y, pos.z));
        }
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2, transparent: true, opacity: 0.65 });
      scene.add(new THREE.Line(geo, mat));
    }

    const currentYear = currentDate.getFullYear();
    drawSunPath(`${currentYear}-06-21`, 0xff5722); 
    drawSunPath(`${currentYear}-03-21`, 0x4caf50); 
    drawSunPath(`${currentYear}-12-21`, 0x2196f3); 

    // 5. CẬP NHẬT GIAO DIỆN & CẢNH 3D
    const timeSlider = document.getElementById('time-slider');
    const dateInput = document.getElementById('date-input');
    const autoplayCheckbox = document.getElementById('autoplay-checkbox');

    function updateScene() {
      const dateVal = dateInput.value;
      const timeVal = parseInt(timeSlider.value); 
      
      const hours = Math.floor(timeVal / 60);
      const minutes = timeVal % 60;
      
      document.getElementById('time-display').innerText = 
        `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

      const targetDate = new Date(dateVal);
      targetDate.setHours(hours, minutes, 0, 0);

      const pos = getSunPosition(targetDate);

      sunMesh.position.set(pos.x, pos.y, pos.z);
      sunLight.position.set(pos.x, pos.y, pos.z);

      if (pos.y < 0) {
        sunMesh.material.opacity = 0;
        sunMesh.material.transparent = true;
        sunLight.intensity = 0;
        scene.background = new THREE.Color(0x0a1118); 
      } else {
        sunMesh.material.opacity = 1;
        sunLight.intensity = 1.4;
        const skyColor = new THREE.Color().lerpColors(new THREE.Color(0xf97316), new THREE.Color(0x38bdf8), Math.min(pos.y / 20, 1));
        scene.background = skyColor;
      }

      document.getElementById('val-alt').innerText = (pos.altitude * 180 / Math.PI).toFixed(2);
      let azDeg = ((pos.azimuth * 180 / Math.PI) + 180).toFixed(2);
      document.getElementById('val-az').innerText = azDeg;
    }

    timeSlider.addEventListener('input', updateScene);
    dateInput.addEventListener('change', updateScene);

    // 6. XỬ LÝ NÚT ẨN/HIỆN PANEL TRÊN MOBILE
    const uiPanel = document.getElementById('ui-panel');
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
      uiPanel.classList.toggle('hidden');
    });

    // 7. LOOP RENDER & AUTO-PLAY
    updateScene();

    function animate() {
      requestAnimationFrame(animate);

      // Nếu chọn tự động chạy
      if (autoplayCheckbox.checked) {
        let currentVal = parseInt(timeSlider.value);
        currentVal += 2; // Tốc độ chạy (2 phút / frame)
        if (currentVal > 1440) currentVal = 0;
        timeSlider.value = currentVal;
        updateScene();
      }

      controls.update(); 
      renderer.render(scene, camera);
    }
    animate();

    // 8. TỰ ĐỘNG THÍCH ỨNG KÍCH THƯỚC MÀN HÌNH
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
